x-rust-app: &rust-app
  image: motogear-shop:local
  build:
    context: .
    dockerfile: Dockerfile

x-database-environment: &database-environment
  POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  kafka:
    image: apache/kafka:4.4.0
    hostname: kafka
    depends_on:
      kafka-volume-init:
        condition: service_completed_successfully
    # Plaintext is limited to local development and the private Compose network.
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_LISTENERS: "CONTROLLER://:29093,PLAINTEXT://:19092,PLAINTEXT_HOST://:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      # Replication factors of one are required for this single-broker setup.
      # Do not carry these local settings into a production Kafka cluster.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_MS: 604800000
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    healthcheck:
      # Broker API liveness only; this does not check topic setup or publishing.
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-cluster.sh api-versions --bootstrap-server localhost:19092 >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  kafka-volume-init:
    image: apache/kafka:4.4.0
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown 1000:1000 /tmp/kraft-combined-logs"]
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    restart: "no"

  kafka-init:
    image: apache/kafka:4.4.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/opt/kafka/bin/kafka-topics.sh"]
    command:
      - --bootstrap-server
      - kafka:19092
      - --create
      - --if-not-exists
      - --topic
      - ${KAFKA_ORDERS_TOPIC:-shop.orders.v1}
      - --partitions
      - "3"
      - --replication-factor
      - "1"
    restart: "no"

  migrate:
    <<: *rust-app
    command: ["/usr/local/bin/migrate"]
    environment: *database-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  seed:
    <<: *rust-app
    profiles: ["demo"]
    command: ["/usr/local/bin/seed"]
    environment: *database-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    <<: *rust-app
    command: ["/usr/local/bin/motogear-api"]
    environment:
      <<: *database-environment
      API_BIND_ADDRESS: "0.0.0.0:3000"
      KAFKA_ORDERS_TOPIC: ${KAFKA_ORDERS_TOPIC:-shop.orders.v1}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:3000/health/ready >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  publisher:
    <<: *rust-app
    command: ["/usr/local/bin/publisher"]
    environment:
      <<: *database-environment
      KAFKA_BROKERS: ${KAFKA_BROKERS_DOCKER:-kafka:19092}
      KAFKA_ORDERS_TOPIC: ${KAFKA_ORDERS_TOPIC:-shop.orders.v1}
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_signal: SIGINT
    stop_grace_period: 30s

  inventory:
    <<: *rust-app
    command: ["/usr/local/bin/inventory"]
    environment:
      <<: *database-environment
      KAFKA_BROKERS: ${KAFKA_BROKERS_DOCKER:-kafka:19092}
      KAFKA_ORDERS_TOPIC: ${KAFKA_ORDERS_TOPIC:-shop.orders.v1}
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_signal: SIGINT
    stop_grace_period: 30s

  fulfillment:
    <<: *rust-app
    command: ["/usr/local/bin/fulfillment"]
    environment:
      <<: *database-environment
      KAFKA_BROKERS: ${KAFKA_BROKERS_DOCKER:-kafka:19092}
      KAFKA_ORDERS_TOPIC: ${KAFKA_ORDERS_TOPIC:-shop.orders.v1}
      FULFILLMENT_DELAY_MS: ${FULFILLMENT_DELAY_MS:-2000}
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_signal: SIGINT
    stop_grace_period: 30s

  notifications:
    <<: *rust-app
    command: ["/usr/local/bin/notifications"]
    environment:
      <<: *database-environment
      KAFKA_BROKERS: ${KAFKA_BROKERS_DOCKER:-kafka:19092}
      KAFKA_ORDERS_TOPIC: ${KAFKA_ORDERS_TOPIC:-shop.orders.v1}
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_signal: SIGINT
    stop_grace_period: 30s

volumes:
  postgres_data:
  kafka_data:
