[package]
name = "motogear-api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
dotenvy = "0.15.7"
motogear-persistence = { version = "0.1.0", path = "../persistence" }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread"] }
tower-http = { version = "0.7.1", default-features = false, features = ["fs"] }
uuid = { version = "1.29.0", features = ["serde", "v4"] }

[dev-dependencies]
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "uuid"] }
tower = { version = "0.5.3", features = ["util"] }
