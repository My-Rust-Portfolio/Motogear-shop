[package]
name = "motogear-workers"
version = "0.1.0"
edition = "2024"

[dependencies]
dotenvy = "0.15.7"
motogear-persistence = { version = "0.1.0", path = "../persistence" }
rdkafka = { version = "0.39.0", features = ["cmake-build"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "time"] }
uuid = { version = "1.29.0", features = ["serde"] }

[dev-dependencies]
motogear-domain = { version = "0.1.0", path = "../domain" }
sqlx = { version = "0.9.0", default-features = false, features = ["json", "macros", "postgres", "runtime-tokio", "tls-rustls", "uuid"] }
