[package]
name = "motogear-persistence"
version = "0.1.0"
edition = "2024"

[dependencies]
dotenvy = "0.15.7"
motogear-domain = { version = "0.1.0", path = "../domain" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["json", "macros", "migrate", "postgres", "runtime-tokio", "tls-rustls", "uuid"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time"] }
uuid = { version = "1.29.0", features = ["serde", "v4"] }
